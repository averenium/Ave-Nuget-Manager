name: Publish Preview Extension

# Manual, separate from publish.yml (which only reacts to `v*` tags on the
# stable track). Pick the branch/ref to build from the "Run workflow" UI —
# this never touches tags or the stable publish job.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Preview version (numeric major.minor.patch only — the Marketplace
          rejects semver pre-release suffixes). Convention: odd minor for
          preview builds (0.9.x) while stable stays even (0.8.x, 0.10.x, ...).
        required: true
        type: string

jobs:
  publish-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install dependencies
        run: npm ci

      - name: Set preview version (this checkout only, never committed)
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Package extension (pre-release)
        run: npm run package

      - name: Get extension metadata
        id: metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "vsix_file=${NAME}-${VERSION}.vsix" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to VS Marketplace (pre-release)
        run: npx vsce publish --pre-release -p ${{ secrets.VSCE_PAT }} --skip-duplicate

      - name: Publish to Open VSX (pre-release)
        run: npx ovsx publish ${{ steps.metadata.outputs.vsix_file }} --pre-release -p ${{ secrets.OVSX_PAT }} --skip-duplicate

      - name: Upload .vsix as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.vsix_file }}
          path: ${{ steps.metadata.outputs.vsix_file }}
          retention-days: 30
