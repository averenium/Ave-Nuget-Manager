name: Publish Extension

on:
  push:
    tags:
      - 'v*' # Спрацьовує при пуші тегу, наприклад, v0.4.2

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npx vsce package

      - name: Get extension metadata
        id: metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "vsix_file=${NAME}-${VERSION}.vsix" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to VS Marketplace
        run: npx vsce publish -p ${{ secrets.VSCE_PAT }} --skip-duplicate

      - name: Publish to Open VSX
        run: npx ovsx publish ${{ steps.metadata.outputs.vsix_file }} -p ${{ secrets.OVSX_PAT }} --skip-duplicate

      - name: Extract Changelog section
        id: extract_changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          path: CHANGELOG.md
          version: ${{ steps.metadata.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.metadata.outputs.vsix_file }}
          body: ${{ steps.extract_changelog.outputs.changes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}